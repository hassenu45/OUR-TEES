<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — AZMA</title>
  <link rel="stylesheet" href="assets/css/design-tokens.css">
  <style>
    /* أسلوب صفحة الطلبات: خلفية داكنة، بطاقات، أزرار ذهبية — راجع التصميم الكامل في ملف الصفحة النهائي */
    body { margin:0; background: var(--az-bg, #0C0A09); color: #FAFAF9; font-family: 'Montserrat', sans-serif; min-height: 100vh; }
    .mo-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid rgba(255,255,255,.06); position:sticky; top:0; background:rgba(12,10,9,.85); backdrop-filter:blur(14px); z-index:20; }
    .mo-logo { font-family:'Cormorant', serif; font-size:20px; font-weight:700; letter-spacing:.04em; }
    .mo-logo span { color:#A16207; }
    .mo-back { color:rgba(250,250,249,.55); text-decoration:none; font-size:12px; border:1px solid rgba(255,255,255,.08); padding:7px 14px; border-radius:8px; }
    .mo-tabs { display:flex; gap:8px; max-width:880px; margin:20px auto 0; padding:0 16px; }
    .mo-tab { flex:1; text-align:center; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,.02); cursor:pointer; font-size:13px; font-weight:600; color:rgba(250,250,249,.6); }
    .mo-tab.active { background:rgba(161,98,7,.15); border-color:rgba(161,98,7,.35); color:#FBBF24; }
    .mo-wrap { max-width:880px; margin:16px auto 64px; padding:0 16px; display:grid; gap:16px; }
    .mo-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:18px; }
    .mo-card h3 { margin:0 0 12px; font-size:14px; color:#FBBF24; font-family:'Cormorant', serif; }
    .mo-field { display:grid; gap:5px; margin-bottom:12px; }
    .mo-field label { font-size:11px; color:rgba(250,250,249,.55); }
    .mo-field input, .mo-field textarea, .mo-pay-opt { width:100%; box-sizing:border-box; padding:11px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); color:#FAFAF9; font-size:13px; font-family:inherit; }
    .mo-field input:focus { outline:none; border-color:rgba(161,98,7,.5); }
    .mo-pay { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .mo-pay-opt { display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:12px; background:rgba(255,255,255,.03); font-size:12px; }
    .mo-pay-opt.selected { border-color:#FBBF24; background:rgba(161,98,7,.12); }
    .mo-btn { width:100%; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#A16207,#854D0E); color:#FAFAF9; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .mo-btn:disabled { opacity:.5; cursor:wait; }
    .mo-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .mo-item img { width:52px; height:52px; object-fit:cover; border-radius:8px; }
    .mo-item-info { flex:1; min-width:0; }
    .mo-item-name { font-size:13px; font-weight:600; }
    .mo-item-meta { font-size:11px; color:rgba(250,250,249,.5); }
    .mo-order { border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:14px; background:rgba(255,255,255,.02); margin-bottom:12px; }
    .mo-order-top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .mo-order-name { font-size:13px; font-weight:700; }
    .mo-badge { font-size:10px; padding:3px 9px; border-radius:100px; }
    .mo-badge.new { background:rgba(245,200,66,.15); color:#FBBF24; }
    .mo-badge.completed { background:rgba(74,222,128,.15); color:#4ADE80; }
    .mo-badge.cancelled { background:rgba(252,165,165,.15); color:#FCA5A5; }
    .mo-badge.card { background:rgba(96,165,250,.15); color:#93C5FD; }
    .mo-order-meta { font-size:11px; color:rgba(250,250,249,.5); margin-top:6px; }
    .mo-cancel { margin-top:10px; background:none; border:1px solid rgba(252,165,165,.35); color:#FCA5A5; padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; }
    .mo-cancel:disabled { opacity:.4; cursor:not-allowed; }
    .mo-empty { text-align:center; padding:40px 16px; color:rgba(250,250,249,.4); font-size:13px; }
    .mo-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:50; }
    .mo-overlay.show { display:flex; }
    .mo-overlay-card { background:#1C1917; border:1px solid rgba(255,255,255,.08); padding:26px 34px; border-radius:14px; text-align:center; }
    .mo-overlay-card .spin { width:34px; height:34px; border:3px solid rgba(245,200,66,.2); border-top-color:#FBBF24; border-radius:50%; margin:0 auto 12px; animation:moSpin 1s linear infinite; }
    @keyframes moSpin { to { transform:rotate(360deg); } }
    .mo-success { text-align:center; padding:30px 0; }
    .mo-success .chk { width:54px; height:54px; border-radius:50%; background:rgba(74,222,128,.15); color:#4ADE80; font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
    @media (max-width:600px){ .mo-pay{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="mo-header">
    <div class="mo-logo">OUR <span>TEES</span></div>
    <a class="mo-back" href="store.html">→ العودة للمتجر</a>
  </header>

  <div class="mo-tabs">
    <button class="mo-tab active" id="tab-checkout" onclick="switchTab('checkout')">🛒 إتمام الطلب</button>
    <button class="mo-tab" id="tab-orders" onclick="switchTab('orders')">📦 طلباتي</button>
  </div>

  <div class="mo-wrap" id="panel-checkout">
    <div class="mo-card">
      <h3>ملخص طلبك</h3>
      <div id="mo-cart-items"></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:12px;">
        <span>المجموع</span>
        <span id="mo-cart-total">0</span>
      </div>
    </div>
    <div class="mo-card">
      <h3>معلومات التوصيل</h3>
      <div class="mo-field"><label>الاسم الكامل *</label><input id="mo-name" placeholder="محمد أحمد"></div>
      <div class="mo-field"><label>رقم الهاتف *</label><input id="mo-phone" placeholder="07XXXXXXXX" dir="ltr"></div>
      <div class="mo-field"><label>المدينة *</label><input id="mo-city" placeholder="عمّان"></div>
      <div class="mo-field"><label>الحي / المنطقة</label><input id="mo-area" placeholder="الصويفية"></div>
      <div class="mo-field"><label>الشارع</label><input id="mo-street" placeholder="شارع المدينة"></div>
      <div class="mo-field"><label>معلم قريب (اختياري)</label><input id="mo-landmark" placeholder="بجانب المسجد"></div>
      <div class="mo-field"><label>ملاحظات (اختياري)</label><textarea id="mo-notes" rows="2" placeholder="أي تفاصيل إضافية..."></textarea>
      <h3 style="margin-top:16px;">طريقة الدفع</h3>
      <div class="mo-pay">
        <div class="mo-pay-opt selected" id="pay-cod" onclick="pickPayment('cod')">💵 الدفع عند الاستلام</div>
        <div class="mo-pay-opt" id="pay-card" onclick="pickPayment('card')">💳 دفع إلكتروني</div>
      </div>
      <p id="mo-error" style="color:#FCA5A5;font-size:12px;display:none;margin:10px 0;"></p>
      <button class="mo-btn" id="mo-submit" onclick="submitOrderFlow()">تأكيد الطلب</button>
    </div>
  </div>

  <div class="mo-wrap" id="panel-orders" style="display:none;">
    <div class="mo-card" id="mo-phone-panel">
      <h3>شوف طلباتك</h3>
      <div class="mo-field"><label>رقم الهاتف</label><input id="mo-lookup-phone" placeholder="07XXXXXXXX" dir="ltr"></div>
      <button class="mo-btn" onclick="lookupOrders()">عرض طلباتي</button>
    </div>
    <div class="mo-card" id="mo-orders-panel" style="display:none;">
      <h3>طلباتي <span id="mo-customer-name" style="font-weight:400;font-size:12px;color:rgba(250,250,249,.5);"></span></h3>
      <div id="mo-orders-list"></div>
    </div>
  </div>

  <div class="mo-overlay" id="mo-overlay">
    <div class="mo-overlay-card">
      <div class="spin"></div>
      <div id="mo-overlay-text">جاري معالجة الدفع...</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/db-local.js"></script>
  <script src="js/my-orders.js"></script>
</body>
</html>
