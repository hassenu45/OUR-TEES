<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZMA — اتصال انستقرام</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            --tees-black:#0D0D0D;
            --tees-surface:#161616;
            --tees-yellow:#F5C842;
            --tees-white:#F5F5F0;
            --tees-muted:#888884;
            --tees-border:#2a2a2a;
            --tees-font:'Cairo',sans-serif;
            --tees-display:'Bebas Neue',sans-serif;
        }
        body{background:var(--tees-black);font-family:var(--tees-font);color:var(--tees-white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:var(--tees-surface);border:1px solid var(--tees-border);border-radius:14px;padding:44px 38px;max-width:460px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
        .icon{font-size:56px;line-height:1;margin-bottom:18px;animation:pop .5s cubic-bezier(.16,1,.3,1)}
        @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
        h1{font-size:22px;font-weight:900;margin-bottom:10px}
        p{color:var(--tees-muted);font-size:14px;line-height:1.9}
        .brand{font-family:var(--tees-display);font-size:18px;letter-spacing:4px;color:var(--tees-yellow);margin-top:26px}
        .reason{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:16px;text-align:right}
        .ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#86efac;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:16px}
        a.close{display:inline-block;margin-top:22px;background:var(--tees-yellow);color:var(--tees-black);border:none;padding:12px 30px;font-family:var(--tees-font);font-weight:800;font-size:14px;cursor:pointer;border-radius:8px;text-decoration:none}
        a.close:hover{opacity:.9}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="icon">✅</div>
        <h1 id="title">تم الاتصال بالانستقرام</h1>
        <p id="desc">تم حفظ التوكن بشكل دائم وتفعيل الرد الآلي.<br>يمكنك إغلاق هذه الصفحة والعودة للوحة التحكم.</p>
        <div class="ok" id="detail" style="display:none;"></div>
        <div class="reason" id="reason" style="display:none;"></div>
        <a class="close" href="javascript:window.close()">إغلاق هذه الصفحة</a>
        <div class="brand">AZMA.COM</div>
    </div>
    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            var ok = p.get('ig') === 'connected';
            var user = p.get('user') || '';
            var reason = p.get('reason') || '';
            document.getElementById('icon').textContent = ok ? '✅' : '❌';
            document.getElementById('title').textContent = ok ? 'تم الاتصال بالانستقرام' : 'فشل الاتصال بالانستقرام';
            document.getElementById('desc').textContent = ok
                ? ('تم حفظ التوكن بشكل دائم وتفعيل الرد الآلي' + (user ? ' للحساب @' + user : '') + '.<br>يمكنك إغلاق هذه الصفحة والعودة للوحة التحكم.')
                : 'حدث خطأ أثناء الاتصال. يمكنك إغلاق هذه الصفحة والمحاولة مرة أخرى.';
            if (ok && user) {
                var d = document.getElementById('detail');
                d.style.display = 'block';
                d.textContent = 'الحساب المتصل: @' + user;
            }
            if (!ok && reason) {
                var r = document.getElementById('reason');
                r.style.display = 'block';
                r.textContent = decodeURIComponent(reason);
            }
            var closeBtn = document.querySelector('a.close');
            if (!window.opener && !window.parent) closeBtn.remove();
        })();
    </script>
</body>
</html>
